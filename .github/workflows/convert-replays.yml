name: Convert SC2 Replays

on:
  push:
  workflow_dispatch:

jobs:
  convert-replays:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache SC2 headless
      id: cache-sc2
      uses: actions/cache@v4
      with:
        path: /tmp/sc2
        key: sc2-4.10-linux

    - name: Download and install SC2 headless
      if: steps.cache-sc2.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/sc2
        cd /tmp/sc2
        wget https://blzdistsc2-a.akamaihd.net/Linux/SC2.4.10.zip
        unzip -P iagreetotheeula SC2.4.10.zip
        rm SC2.4.10.zip

    - name: install map
      run: cp -r ./converttest/maps/* /tmp/sc2/StarCraftII/Maps/

    - name: Install dependencies
      run: |
        uv pip install -r requirements.txt -e . --system

    - name: Prepare directories
      run: |
        mkdir -p ${{ github.workspace }}/converted_output

    - name: Generate partition file
      run: |
        cd converttest
        for replay in *.SC2Replay; do
          basename "$replay" .SC2Replay >> partition.txt
        done
        echo "Found $(wc -l < partition.txt) replays to convert"
        cat partition.txt

    - name: Convert replays
      env:
        SC2PATH: /tmp/sc2/StarCraftII
      run: |
        python3 -m alphastar.unplugged.data.generate_dataset \
          --sc2_replay_path=${{ github.workspace }}/converttest \
          --converted_path=${{ github.workspace }}/converted_output \
          --partition_file=${{ github.workspace }}/converttest/partition.txt \
          --converter_settings=./alphastar/unplugged/configs/alphastar_supervised_converter_settings.pbtxt

    - name: Upload converted replays
      uses: actions/upload-artifact@v4
      with:
        name: converted-replays
        path: converted_output/
        retention-days: 30
